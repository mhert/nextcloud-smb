name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # Bump together with the deployment that uses the image. The suffix counts rebuilds of
  # the same Nextcloud version (Dockerfile changes).
  NEXTCLOUD_TAG: 35.0.3-apache
  REVISION: "1"

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NEXTCLOUD_TAG=${{ env.NEXTCLOUD_TAG }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.NEXTCLOUD_TAG }}-${{ env.REVISION }}
            ghcr.io/${{ github.repository }}:${{ env.NEXTCLOUD_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Official Nextcloud image with the smbclient PHP extension
